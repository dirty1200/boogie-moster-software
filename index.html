<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boogie Monster Software | Vintage Sampler Tools</title>
    <style>
        /* MODERN & CLEAN VARIABLES */
        :root {
            --bg-color: #ffffff;
            --bg-secondary: #f8fafc; /* Slight contrast for footer */
            --text-main: #1e293b;
            --text-muted: #64748b;
            --brand-dark: #0f172a;
            --brand-green: #22c55e;
            --border-color: #e2e8f0;
        }

        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* CONTAINER */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* NAVIGATION */
        header {
            border-bottom: 1px solid var(--border-color);
            padding: 2rem 0;
            background: var(--bg-color);
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            height: 120px; /* Adjusted slightly for proportion */
            width: auto;
            display: block;
            margin-bottom: 2rem; 
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: var(--brand-dark);
        }

        /* HERO SECTION */
        .hero {
            padding: 6rem 0 8rem 0;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-content {
            max-width: 700px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--brand-dark);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 3.5rem;
        }

        /* SCREENSHOTS GRID (UPDATED to CSS GRID) */
        .screenshot-grid {
            display: grid;
            /* This creates a responsive grid that autofills columns */
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 2rem;
            margin-top: 1rem;
            /* Ensures items align to the top if images have different heights */
            align-items: start; 
        }

        /* Optional: Force 2 columns on tablet/small laptops for better neatness with 4 items */
        @media (min-width: 600px) and (max-width: 1024px) {
            .screenshot-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .screenshot-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .screenshot-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block; /* Removes bottom spacing whitespace */
        }

        .screenshot-img:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
        }

        /* FOOTER */
        footer {
            padding: 3rem 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .hero h1 { font-size: 2.2rem; }
            .nav-links { 
                flex-direction: column; 
                gap: 1rem;  
            }
            .screenshot-grid {
                /* On mobile, stack them 1 per row */
                grid-template-columns: 1fr;
                gap: 2rem;
            } 
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <img src="new_logo.png" alt="Boogie Monster Software" class="logo-img">
                
                <div class="nav-links">
                    <a href="about.html">About</a>
                    <a href="#">Contact</a>
                    <a href="#">Support</a>
                </div>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>Modern workflow for <br>vintage hardware.</h1>
                <p>Reliable file management and sample processing tools for Vintage Akai and Roland samplers.</p>
            </div>
            
            <div class="screenshot-grid">
                
                <div class="screenshot-item">
                    <a href="wav2mpc.html" style="display: block; width: 100%;">
                        <img src="wav2mpc.png" alt="WAV to MPC Converter" class="screenshot-img">
                    </a> </div>

                <div class="screenshot-item">
                    <a href="w-30converter.html" style="display: block; width: 100%;">
                        <img src="w-30converter.png" alt="Roland W-30 Converter" class="screenshot-img">
                    </a> </div>

                <div class="screenshot-item">
                    <a href="diskextractor.html" style="display: block; width: 100%;">
                        <img src="diskextractor.png" alt="Disk Extractor" class="screenshot-img">
                    </a>
                </div>
               
            </div> 
        </div> 
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 Boogie Monster Software.</p>
            <p>We are not affiliated with Akai Professional or Roland Corp.</p>
        </div>
    </footer>

</body>
</html>
