<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boogie Monster Software | Vintage Sampler Tools</title>
    <style>
        /* =========================================
           PREMIUM ANALOG VARIABLES
           ========================================= */
        :root {
            --bg-color: #f4f4f0; /* Warm vintage sampler off-white */
            --bg-secondary: #e8e8e3; /* Slightly darker hardware gray */
            --text-main: #2b2b2b; /* Deep charcoal for readability */
            --text-muted: #6b6b6b;
            --brand-dark: #111111;
            --brand-accent: #d9381e; /* Vintage hardware red */
            --border-color: #d1d1cd;
            --font-mono: "ui-monospace", "SFMono-Regular", "IBM Plex Mono", "Courier New", monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* CSS-ONLY NOISE GRAIN FOR ANALOG TEXTURE */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
            opacity: 0.05;
            pointer-events: none;
            z-index: 9999;
        }

        /* CONTAINER */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* NAVIGATION */
        header {
            border-bottom: 2px solid var(--brand-dark);
            padding: 2.5rem 0;
            background: var(--bg-color);
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            height: 110px; 
            width: auto;
            display: block;
            margin-bottom: 2.5rem; 
            filter: contrast(1.1) brightness(0.95);
        }

        .nav-links {
            display: flex;
            gap: 3rem;
        }

        .nav-links a {
            font-family: var(--font-mono);
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--brand-dark);
            border-bottom: 2px solid var(--brand-accent);
        }

        /* HERO SECTION */
        .hero {
            padding: 7rem 0 9rem 0;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            color: var(--brand-dark);
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        .hero p {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 4rem;
            letter-spacing: 0.5px;
        }

        /* SCREENSHOTS GRID */
        .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 2.5rem;
            margin-top: 2rem;
            align-items: start; 
        }

        .screenshot-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            background: var(--bg-color);
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .screenshot-item:hover {
            transform: translateY(-4px) translateX(-2px);
            box-shadow: 8px 8px 0px rgba(217, 56, 30, 0.15); /* Red shadow on hover */
            border-color: var(--brand-dark);
        }

        .screenshot-img {
            width: 100%;
            height: auto;
            display: block; 
            border: 1px solid var(--border-color);
        }

        /* FOOTER */
        footer {
            padding: 3.5rem 0;
            text-align: center;
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 2px solid var(--brand-dark);
            background-color: var(--bg-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer p { margin-bottom: 0.5rem; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .nav-links { gap: 1.5rem; }
            .screenshot-grid { grid-template-columns: 1fr; gap: 2rem; } 
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html">
                    <img src="new_logo.png" alt="Boogie Monster Software" class="logo-img">
                </a>
                
                <div class="nav-links">
                    <a href="about.html">About</a>
                    <a href="#">Contact</a>
                    <a href="#">Support</a>
                </div>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>Modern workflow for <br>vintage hardware.</h1>
                <p>> Reliable file management and sample processing tools for Vintage Akai and Roland samplers_</p>
            </div>
            
            <div class="screenshot-grid">
                <div class="screenshot-item">
                    <a href="wav2mpc.html" style="display: block; width: 100%;">
                        <img src="wav2mpc.png" alt="WAV to MPC Converter" class="screenshot-img">
                    </a> 
                </div>

                <div class="screenshot-item">
                    <a href="w-30converter.html" style="display: block; width: 100%;">
                        <img src="w-30converter.png" alt="Roland W-30 Converter" class="screenshot-img">
                    </a> 
                </div>

                <div class="screenshot-item">
                    <a href="diskextractor.html" style="display: block; width: 100%;">
                        <img src="diskextractor.png" alt="Disk Extractor" class="screenshot-img">
                    </a>
                </div>
            </div> 
        </div> 
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 Boogie Monster Software.</p>
            <p>We are not affiliated with Akai Professional or Roland Corp.</p>
        </div>
    </footer>

</body>
</html>
